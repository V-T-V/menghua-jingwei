<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>梦华经纬 · 循读断言</title>
<style>
body{font-family:KaiTi,serif;background:#241f17;color:#e8e0c8;padding:24px;line-height:1.8}
h2{font-weight:400;letter-spacing:4px;border-bottom:1px solid #a8874a;padding-bottom:6px}
.pass{color:#8fae8d}.fail{color:#e08a7e;font-weight:bold}
li{list-style:none;margin:4px 0}
#stage{position:fixed;left:-4000px;top:0;width:900px;height:700px}
</style>
</head>
<body>
<h2>循读断言 · 梦华经纬（index.html 主流程 DOM 级）</h2>
<ul id="out"></ul>
<div id="stage"><iframe id="fr" width="900" height="700"></iframe></div>
<script>
const out = document.getElementById("out");
let n = 0, bad = 0;
function assert(cond, label) {
  n++;
  const li = document.createElement("li");
  li.textContent = (cond ? "✓ " : "✗ ") + label;
  li.className = cond ? "pass" : "fail";
  if (!cond) bad++;
  out.appendChild(li);
}
const fr = document.getElementById("fr");
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function run() {
  /* 时间戳破浏览器启发式缓存（http.server 无 Cache-Control） */
  const bust = "?fresh=" + Date.now();
  await new Promise(r => { fr.onload = r; fr.src = "../index.html" + bust + "#m=map"; });
  await sleep(2600);                       /* 等 boot+数据 */
  let doc;
  try { doc = fr.contentDocument; } catch (e) { doc = null; }
  assert(!!doc, "iframe 加载 index.html");
  if (!doc) return finish();
  assert(!!doc.getElementById("boot"), "序幕 DOM 存在");
  /* 深链：街市详情 */
  fr.src = "../index.html" + bust + "#jie=" + encodeURIComponent("州橋夜市");
  await sleep(2000);
  doc = fr.contentDocument;
  const vname = doc.getElementById("vname");
  assert(vname && vname.textContent === "州橋夜市",
    `深链 #jie=州橋夜市 → 面板「${vname && vname.textContent}」`);
  const pbody = doc.getElementById("pbody");
  assert(pbody && pbody.textContent.includes("雜嚼直至三更"),
    "州橋夜市原文段挂接（含「雜嚼直至三更」）");
  assert(doc.getElementById("panel").classList.contains("open"), "详情面板 open");
  /* 深链：城门 */
  fr.src = "../index.html" + bust + "#men=" + encodeURIComponent("南薰門");
  await sleep(1800);
  doc = fr.contentDocument;
  assert(doc.getElementById("vname").textContent === "南薰門",
    `深链 #men=南薰門 → 面板「${doc.getElementById("vname").textContent}」`);
  assert(doc.getElementById("pbody").textContent.includes("甕城三層"),
    "城门书证在场（「甕城三層」）");
  /* 深链：河道 */
  fr.src = "../index.html" + bust + "#he=" + encodeURIComponent("汴河");
  await sleep(1800);
  doc = fr.contentDocument;
  assert(doc.getElementById("vname").textContent === "汴河",
    `深链 #he=汴河 → 面板「${doc.getElementById("vname").textContent}」`);
  assert(doc.getElementById("pbody").textContent.includes("洛口"),
    "河证书证在场（「自西亰洛口分水」）");
  /* 深链：循读卷一（城防） */
  fr.src = "../index.html" + bust + "#m=read#juan=1";
  await sleep(2200);
  doc = fr.contentDocument;
  const entries = doc.querySelectorAll("#pbody .entry");
  assert(entries.length === 6, `循读卷一渲染 ${entries.length} 块 = 6`);
  const firstName = doc.querySelector("#pbody .entry .ename");
  assert(firstName && firstName.textContent === "東都外城",
    `卷一首节「${firstName && firstName.textContent}」= 東都外城`);
  const rprog = doc.getElementById("rprog");
  assert(rprog && rprog.textContent.includes("卷1"), `循读进度条「${rprog && rprog.textContent}」`);
  assert(doc.getElementById("readerbar").classList.contains("hidden") === false, "循读条在场");
  /* 深链：循读卷二落街市块 */
  fr.src = "../index.html" + bust + "#m=read#juan=2#jie=" + encodeURIComponent("馬行街");
  await sleep(2200);
  doc = fr.contentDocument;
  assert(doc.querySelectorAll("#pbody .entry").length === 8, "循读卷二渲染 8 块");
  const cur = doc.querySelector("#pbody .entry.cur");
  assert(cur && cur.dataset.id === "v2-05", `当前块 ${cur && cur.dataset.id} = v2-05（潘樓東街巷）`);
  assert(doc.getElementById("pbody").textContent.includes("人煙浩閙"), "馬行街书证在场");
  /* 深链：节序（卷七 金明池） */
  fr.src = "../index.html" + bust + "#sui=" + encodeURIComponent("三月一日開金明池瓊林苑");
  await sleep(2200);
  doc = fr.contentDocument;
  assert(doc.getElementById("pbody").textContent.includes("順天門街北"),
    "节序深链 → 卷七金明池原文（「順天門街北」）");
  /* 岁时时间轴 */
  fr.src = "../index.html" + bust + "#m=suishi";
  await sleep(2400);
  doc = fr.contentDocument;
  const cards = doc.querySelectorAll(".suicard");
  assert(cards.length === 43, `岁时卡 ${cards.length} = 43`);
  assert(doc.getElementById("pbody").textContent.includes("正月"), "时间轴含正月");
  assert(doc.getElementById("vname").textContent === "岁时记", "岁时面板标题");
  /* 检索 */
  fr.src = "../index.html" + bust + "#m=map";
  await sleep(2200);
  doc = fr.contentDocument;
  const se = doc.getElementById("search");
  se.value = "磨喝樂";
  doc.defaultView.MHSEARCH.run();
  await sleep(1400);
  const srs = doc.querySelectorAll("#sresults .sr[data-i]");
  assert(srs.length >= 1, `检索「磨喝樂」得 ${srs.length} 条 ≥ 1`);
  se.value = "宣德";
  doc.defaultView.MHSEARCH.run();
  await sleep(1400);
  const srs2 = doc.querySelectorAll("#sresults .sr[data-i]");
  assert(srs2.length >= 5, `检索「宣德」得 ${srs2.length} 条 ≥ 5`);
  finish();
}

function finish() {
  const title = bad === 0 ? `PASS (${n})` : `FAIL (${bad}/${n})`;
  document.title = title;
  const li = document.createElement("li");
  li.textContent = `—— ${title}`;
  li.className = bad === 0 ? "pass" : "fail";
  out.appendChild(li);
}

run();
</script>
</body>
</html>
