<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>梦华经纬 · P2 断言</title>
<style>
body{font-family:KaiTi,serif;background:#241f17;color:#e8e0c8;padding:24px;line-height:1.8}
h2{font-weight:400;letter-spacing:4px;border-bottom:1px solid #a8874a;padding-bottom:6px}
.pass{color:#8fae8d}.fail{color:#e08a7e;font-weight:bold}
li{list-style:none;margin:4px 0}
#stage{position:fixed;left:-4000px;top:0;width:900px;height:700px}
</style>
</head>
<body>
<h2>P2 断言 · 梦华经纬（桥数据 · 前端挂接 · 导出同口径 · SW 键对齐）</h2>
<ul id="out"></ul>
<div id="stage"><iframe id="fr" width="900" height="700"></iframe></div>
<script src="../data/site_data.js?v=2"></script>
<script src="../data/stats.js?v=2"></script>
<script>
const out = document.getElementById("out");
let n = 0, bad = 0;
function assert(cond, label) {
  n++;
  const li = document.createElement("li");
  li.textContent = (cond ? "✓ " : "✗ ") + label;
  li.className = cond ? "pass" : "fail";
  if (!cond) bad++;
  out.appendChild(li);
}
const fr = document.getElementById("fr");
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function run() {
  /* ── 桥数据文件在位且可解析（同源 fetch，非 script 标签——避免解析失败静默） ── */
  let hy = null, ly = null;
  try {
    const t = await (await fetch("../data/xref_hy.js?v=2")).text();
    const head = "window.MH_XREF_HY = ";
    hy = JSON.parse(t.slice(t.indexOf(head) + head.length).trim().replace(/;$/, ""));
  } catch (e) {}
  assert(!!hy, "寰宇桥数据 xref_hy.js 在位且 JSON 可解析");
  if (hy) {
    assert(hy.rows.length === 9, `寰宇桥对照条目 ${hy.rows.length} = 9`);
    assert(hy.rows.every(r => r.mh && r.hy), "寰宇桥 9 条双双书证非空");
    assert(hy.rows.every(r => r.href === "../TPHY/#zhou=%E9%96%8B%E5%B0%81%E5%BA%9C"),
      "寰宇桥深链统一为 ../TPHY/#zhou=開封府（encodeURIComponent 实测格式）");
    assert(hy.excluded.length === 3, "寰宇桥排除表 3 项（消歧如实）");
    assert(hy.rows.some(r => r.name === "夷門"), "夷門对照在列（大梁十二門 ↔ 夷門山倉）");
  }
  try {
    const t = await (await fetch("../data/xref_ly.js?v=2")).text();
    const head = "window.MH_XREF_LY = ";
    ly = JSON.parse(t.slice(t.indexOf(head) + head.length).trim().replace(/;$/, ""));
  } catch (e) {}
  assert(!!ly, "双京桥数据 xref_ly.js 在位且 JSON 可解析");
  if (ly) {
    assert(ly.params.length === 10, `双京桥城制参数 ${ly.params.length} = 10`);
    assert(ly.pairs.length === 7, `双京桥名物对读 ${ly.pairs.length} = 7`);
    assert(ly.pairs.every(p => p.ly && p.mh), "双京桥 7 对两句书证非空");
    assert(ly.pairs.some(p => p.href === "../LYGL/#gl=永宁寺"), "双京桥深链 #gl=永宁寺 在列");
    assert(ly.params.every(p => p.ly && p.mh), "双京桥参数行双侧非空");
  }

  /* ── 导出同口径（前端表结构 rows 数 = 后端 CSV 行数） ── */
  const rowsCsv = {};
  for (const k of ["gates", "rivers", "places"]) {
    try {
      const t = await (await fetch("../exports/梦华经纬-" +
        { gates: "城门", rivers: "河道", places: "街市" }[k] + ".csv")).text();
      rowsCsv[k] = t.replace(/^\uFEFF/, "").trim().split("\n").length - 1;
    } catch (e) { rowsCsv[k] = -1; }
  }
  assert(rowsCsv.gates === 34, `exports 城门 CSV ${rowsCsv.gates} 行 = 34`);
  assert(rowsCsv.rivers === 4, `exports 河道 CSV ${rowsCsv.rivers} 行 = 4`);
  assert(rowsCsv.places === 21, `exports 街市 CSV ${rowsCsv.places} 行 = 21`);
  const kml = await (await fetch("../exports/梦华经纬-城图.kml")).text();
  assert(kml.split("<Placemark>").length - 1 === 59, `KML 要素 ${kml.split("<Placemark>").length - 1} = 59（55 点 + 4 线）`);
  assert(kml.includes("derived"), "KML 含 derived 注记");
  const gj = JSON.parse(await (await fetch("../exports/梦华经纬-城图.geojson")).text());
  assert(gj.features.length === 59 && gj.features.every(f => (f.properties.src || "").includes("derived")),
    "GeoJSON 59 要素且全部注明 derived");

  /* ── 真页面：计量面板双桥页签挂接 ── */
  const bust = "?fresh=" + Date.now();
  await new Promise(r => { fr.onload = r; fr.src = "../index.html" + bust + "#m=stats"; });
  await sleep(2600);
  let doc;
  try { doc = fr.contentDocument; } catch (e) { doc = null; }
  assert(!!doc, "iframe 加载 index.html（#m=stats）");
  if (doc) {
    const tabs = [...doc.querySelectorAll("#pbody .dtab[data-k]")];
    assert(tabs.length === 4 && tabs.some(t => t.dataset.k === "hy") && tabs.some(t => t.dataset.k === "ly"),
      "计量面板四页签含寰宇桥/双京桥");
    const hyTab = tabs.find(t => t.dataset.k === "hy");
    hyTab.click();
    await sleep(1800);
    const pairs = doc.querySelectorAll("#hybox .xpair");
    assert(pairs.length === 9, `寰宇桥页签渲染 ${pairs.length} 对照条 = 9`);
    const link = doc.querySelector("#hybox .xlink");
    assert(link && link.getAttribute("href") === "../TPHY/#zhou=%E9%96%8B%E5%B0%81%E5%BA%9C",
      "寰宇桥 ↗深链 href 为相对兄弟路径");
    const lyTab = [...doc.querySelectorAll("#pbody .dtab[data-k]")].find(t => t.dataset.k === "ly");
    lyTab.click();
    await sleep(1800);
    const lpairs = doc.querySelectorAll("#lybox .xpair");
    assert(lpairs.length === 7, `双京桥页签渲染 ${lpairs.length} 对读 = 7`);
    const lrows = doc.querySelectorAll("#lybox .strow").length;
    assert(lrows >= 10, `双京桥参数行 ${lrows} ≥ 10`);
  }

  /* ── SW 预存键与页面请求键（含 ?v=）逐字对齐（METHOD 增补：差一个 query 即不中） ── */
  const sw = await (await fetch("../sw.js?v=2")).text();
  const mver = sw.match(/VERSION = "v(\d+)"/);
  assert(!!mver, "sw.js VERSION 常量在位");
  if (mver) {
    const shell = sw.match(/SHELL_FILES\s*=\s*\[([^\]]+)\]/)[1];
    const keys = [...shell.matchAll(/"\.\/([^"]+)"/g)].map(m => m[1]);
    assert(keys.includes(`css/main.css?v=${mver[1]}`), `SW 预存键含 css/main.css?v=${mver[1]}（带 query）`);
    assert(keys.includes(`js/app.js?v=${mver[1]}`), `SW 预存键含 js/app.js?v=${mver[1]}（带 query）`);
    assert(keys.includes("data/site_data.js?v=" + mver[1]), "SW 预存键含 site_data（带 query）");
    assert(sw.includes("![SHELL, TEXTS].includes(k)"), "SW 激活清理为精确保留本版两仓（非 endsWith 泛删）");
  }
  finish();
}

function finish() {
  const title = bad === 0 ? `PASS (${n})` : `FAIL (${bad}/${n})`;
  document.title = title;
  const li = document.createElement("li");
  li.textContent = `—— ${title}`;
  li.className = bad === 0 ? "pass" : "fail";
  out.appendChild(li);
}

run();
</script>
</body>
</html>
